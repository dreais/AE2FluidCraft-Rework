name: Build Fluid Crafting 1.12.2

on:
  push:
    branches:
      - experiment/fluid-injection-safety
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8 (legacy ForgeGradle 2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build
      - name: Upload Minecraft 1.12.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: AE2FluidCraft-Rework-guard1
          path: build/libs/*.jar
          if-no-files-found: error
